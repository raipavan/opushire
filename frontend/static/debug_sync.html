<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>DataEdge Sync Debug</title></head>
<body style="font:14px monospace;background:#111;color:#0f0;padding:16px;">
<h3>DataEdge /api/campaign/state debug</h3>
<pre id="out"></pre>
<script>
var out = document.getElementById('out');
function L(m){ out.textContent += m + "\n"; }
L("token=" + (localStorage.getItem('vernika_token') ? "present" : "MISSING"));
L("role=" + (localStorage.getItem('vernika_role') || "data_edge"));
L("origin=" + location.origin);
var url = "/api/campaign/state?role=" + (localStorage.getItem('vernika_role') || "data_edge");
L("fetching " + url);
fetch(url, { headers: { "Authorization": "Bearer " + (localStorage.getItem('vernika_token') || "") } })
  .then(function(r){
    L("STATUS: " + r.status + " " + r.statusText);
    return r.text();
  })
  .then(function(t){
    L("BODY(len=" + t.length + "):");
    L(t.slice(0, 800));
  })
  .catch(function(e){
    L("FETCH ERROR: " + e.message);
  });
</script>
</body></html>
